name: wikipedia-agent image

on:
  push:
    branches: [main]
    paths: ['wikipedia-agent/**', '.github/workflows/wikipedia-agent.yaml']
    tags: ['wikipedia-agent-v*']
  pull_request:
    paths: ['wikipedia-agent/**', '.github/workflows/wikipedia-agent.yaml']

env:
  IMAGE: ghcr.io/${{ github.repository }}/wikipedia-agent

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wikipedia-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q skills/wikipedia-interest/tests

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=match,pattern=wikipedia-agent-v(\d+\.\d+\.\d+),group=1
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: wikipedia-agent
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
