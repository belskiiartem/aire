apiVersion: v1
kind: Namespace
metadata:
  name: wikipedia-agent
---
# LLM access goes through agentgateway: the agent holds no provider key, and model choice,
# failover and cost limits are managed here rather than in the image.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: openai
  namespace: wikipedia-agent
spec:
  ai:
    provider:
      openai:
        model: gpt-4.1-mini
  policies:
    auth:
      secretRef:
        name: openai-api-key
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wikipedia-agent-llm
  namespace: wikipedia-agent
spec:
  parentRefs:
  - name: agentgateway-external
    namespace: agentgateway-system
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /llm/wikipedia-agent
    backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: openai
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: wikipedia-agent-llm-limits
  namespace: wikipedia-agent
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: wikipedia-agent-llm
  traffic:
    rateLimit:
      local:
      - requests: 60
        unit: Minutes
      - tokens: 300000
        unit: Hours
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wikipedia-agent
  namespace: wikipedia-agent
  labels:
    app.kubernetes.io/name: wikipedia-agent
spec:
  # Conversation memory and the pageview cache are per pod; scale out only after moving them to shared storage.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wikipedia-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wikipedia-agent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
      - name: agent
        image: ghcr.io/belskiiartem/aire/wikipedia-agent:0.1.0
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: LLM_BASE_URL
          value: http://agentgateway-external.agentgateway-system.svc.cluster.local/llm/wikipedia-agent
        - name: LLM_MODEL
          value: gpt-4.1-mini
        - name: WIKI_USER_AGENT
          value: wikipedia-interest-skill/0.2 (https://github.com/belskiiartem/aire)
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 20
          periodSeconds: 30
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        emptyDir:
          sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: wikipedia-agent
  namespace: wikipedia-agent
spec:
  selector:
    app.kubernetes.io/name: wikipedia-agent
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wikipedia-agent
  namespace: wikipedia-agent
spec:
  parentRefs:
  - name: agentgateway-external
    namespace: agentgateway-system
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /wikipedia-agent
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: wikipedia-agent
      port: 8080
